schema_version: topic-adjudication-policy-v1
method: topic-disagreement-triage-v1
max_candidates: 200
allowed_splits: [train]
minimum_confidence: 0.9
short_reply_max_characters: 8
synthetic_fixtures: fixtures/topic-adjudication-v1.json
queue_order:
  - prior_hard_risk_requires_adjudication
  - reply_anchor_disagreement
  - reply_link_disagreement
  - context_sufficiency_disagreement
  - eligibility_disagreement
  - both_nonkeep
  - selected
rules:
  - id: independent_axes
    text: 分别判断回应关联、所指是否完整、沟通价值和风险；状态不能代替任一轴的证据。
  - id: short_reply
    text: 短回复不因长度排除；明确问答、接受、感谢、问候和安慰可构成完整沟通行为。
  - id: referent
    text: 只要求理解本条回复所必需的指代先行词；无关背景缺失不等于不完整，必要主体不明则延期。
  - id: topic_continuation
    text: 同话题或时间相邻不能单独证明回应关系；须指出实际 self 原消息及必要历史证据。
  - id: opener
    text: 有来源证明的历史 target 开场可作为上下文；目标自己续话且无 self 回应对象仍不能保留。
  - id: atomic_anchor
    text: 同一轮的不同原消息不自动视为同一回应对象；相同轮次仅作为裁定提示，不能合并通过。
  - id: missing_history
    text: 尚有未选前文不等于缺少必要证据；完整过去视图只用于诊断，不得看过答案后回填训练输入。
  - id: risk
    text: 旧硬风险需要有来源的独立裁定，不用多数票取消；第三方提及和第三方敏感信息必须区分。
  - id: confidence
    text: 不调整阈值消除模型分歧；缺少关联或必要证据不能靠高置信度补足。
  - id: provenance
    text: 机器意见、确定性分流和人工决定分开保存；分流不修改旧标签、草案或训练资格。
governance:
  training_run: false
  human_review_completed: false
  formal_training_eligible: false
  promotable: false
  existing_labels_changed: false
  selection_policy_changed: false
  external_requests: 0
