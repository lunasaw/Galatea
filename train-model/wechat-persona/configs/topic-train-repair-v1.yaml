schema_version: topic-train-repair-config-v1
allowed_splits: [train]
population: 200
context:
  policy_version: prefix-contiguous-exchanges-v4
  max_context_turns: 16
  max_history_turns: 64
  merge_gap_seconds: 120
  cross_session: false
  cross_day: false
anchor_rule: intersect_replayed_dual_machine_self_anchors
required_context_rule: union_replayed_dual_machine_required_context
reuse_verdict_for_changed_context: false
external_requests: 0
governance:
  training_run: false
  human_review_completed: false
  formal_training_eligible: false
  promotable: false
