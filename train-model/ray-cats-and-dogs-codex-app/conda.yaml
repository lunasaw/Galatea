name: ray-cats-and-dogs-py312
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
dependencies:
  - python=3.12.12
  - pip
  - pip:
      - --index-url https://pypi.tuna.tsinghua.edu.cn/simple
      - boto3==1.43.59
      - ipykernel==7.3.0
      - mlflow==3.14.0
      - numpy==2.2.6
      - pandas==2.3.3
      - pillow==12.0.0
      - PyYAML==6.0.3
