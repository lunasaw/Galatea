[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-handwritten-digits"
version = "0.1.0"
description = "Distributed handwritten-digit training with Ray Train and MLflow"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
