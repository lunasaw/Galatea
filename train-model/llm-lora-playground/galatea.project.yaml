apiVersion: galatea/v1
kind: TrainingProject
metadata:
  name: llm-lora-playground
spec:
  task: causal-language-model-sft-lora
  executionBackend: ray
  packageName: llm_lora_playground
  objective:
    metric: validation_loss
    direction: min
  compatibility:
    - task
    - datasetDigest
    - splitDigest
    - preprocessingVersion
    - metricDefinition
    - evaluationProtocol
    - role
  capabilities:
    pauseResume: false
  configRoot: configs
  entrypoints:
    checkConfig:
      - /data/conda/envs/llm-lora-ray-py312/bin/python
      - scripts/train_lora.py
      - --config
      - "{config}"
      - --check-config
    plan:
      - /data/conda/envs/llm-lora-ray-py312/bin/python
      - scripts/train_lora.py
      - --config
      - "{config}"
      - --plan
    train:
      - /data/conda/envs/llm-lora-ray-py312/bin/python
      - scripts/submit_train.py
      - --config
      - "{config}"
      - --run
  mlflow:
    experimentName: llm-lora-playground
    trackingUriEnv: MLFLOW_TRACKING_URI
    registeredModelName: llm-lora-playground
  runEvidence:
    compatibility:
      task:
        source: constant
        value: causal-language-model-sft-lora
      datasetDigest:
        source: param
        key: data.content_sha256
      splitDigest:
        source: param
        key: data.split_sha256
      preprocessingVersion:
        source: param
        key: data.preprocessing_version
      metricDefinition:
        source: constant
        value: assistant-target-token-cross-entropy-v2
      evaluationProtocol:
        source: param
        key: evaluation.protocol_version
      role:
        source: tag
        key: run.role
    provenance:
      executionIdentity: {source: tag, key: galatea.execution.identity}
      project: {source: tag, key: galatea.project}
      release: {source: tag, key: galatea.release.id}
      submission: {source: tag, key: galatea.submission.id}
      readiness: {source: tag, key: galatea.readiness.digest}
      executionMode: {source: tag, key: galatea.execution.mode}
      promotable: {source: tag, key: galatea.promotable}
    requiredTags:
      run.outcome: succeeded
      artifact.roundtrip_verified: "true"
    stageArtifacts:
      training-optimization:
        - manifests/run_manifest.json
        - reports/validation_quality.json
        - model/adapter_config.json
        - model/adapter_model.safetensors
      final-validation:
        - reports/final-test-evaluation.json
        - model/adapter_config.json
        - model/adapter_model.safetensors
    modelSource:
      artifactPath: model
      uriTag: model.uri
  integrity:
    planOutputPath: integrity
    reports:
      preprocessing:
        artifactPath: reports/preprocessing-parity.json
        roles: [smoke, trial, champion]
        statusPath: status
        digestPath: content_digest
        statusSource: {source: tag, key: integrity.preprocessing.status}
        digestSource: {source: param, key: integrity.preprocessing_artifact_digest}
      migration:
        artifactPath: reports/migration-contamination.json
        roles: [smoke, trial, champion]
        statusPath: status
        digestPath: content_digest
        statusSource: {source: tag, key: integrity.migration.status}
        digestSource: {source: param, key: integrity.migration_artifact_digest}
    preprocessing:
      contexts:
        - {id: fit, roles: [smoke, trial, champion], outputPath: preprocessing.context_identity_tuples.fit}
        - {id: validation, roles: [smoke, trial, champion], outputPath: preprocessing.context_identity_tuples.validation}
      comparisons:
        - id: fit-validation
          roles: [smoke, trial, champion]
          checkPath: preprocessing.parity
          leftContext: fit
          rightContext: validation
          fields: [base_preprocessing_identity_sha256]
          required: true
    migration:
      enabled: true
      lineage:
        roles: [smoke, trial, champion]
        outputPath: migration.lineage
        allowed: [native-clean]
        required: true
      contaminationChecks:
        - {id: source-scan, roles: [smoke, trial, champion], checkPath: migration.contamination.foreign_source_scan, required: true}
        - {id: split-boundaries, roles: [smoke, trial, champion], checkPath: migration.contamination.split_boundaries, required: true}
        - {id: fitted-state, roles: [smoke, trial, champion], checkPath: migration.contamination.fitted_state_leakage, required: true}
        - {id: target-leakage, roles: [smoke, trial, champion], checkPath: migration.contamination.target_leakage, required: true}
        - {id: contamination-status, roles: [smoke, trial, champion], checkPath: migration.contamination.status, required: true}
  qualityGates:
    - name: validation loss
      source: metric
      key: validation_loss
      operator: lt
      threshold: 10
      required: true
    - name: verified checkpoint round-trip
      source: evidence
      key: manifests/run_manifest.json
      operator: exists
      required: true
    - name: validation quality report
      source: evidence
      key: reports/validation_quality.json
      operator: exists
      required: true
    - name: adapter configuration
      source: evidence
      key: model/adapter_config.json
      operator: exists
      required: true
    - name: adapter weights
      source: evidence
      key: model/adapter_model.safetensors
      operator: exists
      required: true
    - name: final generation success
      source: metric
      key: lora_test_generation_generation_success_rate
      operator: gte
      threshold: 1
      required: true
    - name: final repetition rate
      source: metric
      key: lora_test_generation_repetition_3gram_rate
      operator: lte
      threshold: 0.5
      required: true
    - name: final max-length stop rate
      source: metric
      key: lora_test_generation_max_length_stop_rate
      operator: lte
      threshold: 0.5
      required: true
