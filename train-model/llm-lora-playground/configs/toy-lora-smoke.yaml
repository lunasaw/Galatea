run_kind: smoke
model:
  id: Qwen/Qwen3.5-0.8B
  local_path: /data/ai/chenzhangyue/code/model/Qwen3.5-0.8B
  revision_policy: resolve_remote_commit_before_run
  revision: null
  dtype: bfloat16
  device: cuda:0
  max_sequence_length: 512
  trust_remote_code: false
  enable_thinking: false
data:
  uri: platform-data/llm-baselines/toy-lora/v1/dataset.jsonl
  dataset_id: toy-lora-synthetic-toy-v1
  preprocessing_version: toy-sft-v1
  split_strategy: scenario_group
  split_seed: 42
  assistant_only_loss: true
  packing: false
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, v_proj]
  bias: none
training:
  epochs: 1
  max_steps: 10
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  warmup_ratio: 0.03
  scheduler: cosine
  max_grad_norm: 1.0
  optimizer: adamw_torch
  seed: 42
  eval_steps: 5
  save_steps: 5
resources:
  num_gpus: 1
  cpus: 4
  memory_gb: 8
objective_metric: validation_loss
objective_mode: min
prompt:
  use_tokenizer_chat_template: true
generation:
  max_new_tokens: 128
tracking:
  tracking_uri_env: MLFLOW_TRACKING_URI
  experiment_name_env: MLFLOW_EXPERIMENT_NAME
  default_experiment_name: llm-lora-playground
  artifact_root: platform-data/llm-baselines
