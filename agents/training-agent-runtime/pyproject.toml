[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-agent-runtime"
version = "0.1.0"
description = "Independent bounded official Codex SDK campaign runner"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "jsonschema==4.25.1"]

[project.scripts]
training-agent = "training_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"training_agent.runtime" = ["*.schema.json"]
