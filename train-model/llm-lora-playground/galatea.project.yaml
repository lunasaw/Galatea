apiVersion: galatea/v1
kind: TrainingProject
metadata:
  name: llm-lora-playground
spec:
  task: synthetic-sft-lora
  executionBackend: ray
  packageName: llm_lora_playground
  objective:
    metric: validation_loss
    direction: min
  configRoot: configs
  entrypoints:
    checkConfig:
      - python
      - scripts/train_lora.py
      - --config
      - "{config}"
      - --check-config
    smoke:
      - python
      - scripts/train_lora.py
      - --config
      - configs/toy-lora-smoke.yaml
      - --run
    run:
      - python
      - scripts/train_lora.py
      - --config
      - "{config}"
      - --run
  mlflow:
    experimentName: llm-lora-playground
    trackingUriEnv: MLFLOW_TRACKING_URI
