[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-kaggle-house-prices"
version = "0.1.0"
description = "Reproducible Kaggle House Prices tabular regression with Ray and MLflow"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
