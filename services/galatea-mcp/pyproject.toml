[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galatea-mcp"
version = "0.1.0"
description = "Independent governed training MCP service"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "pydantic==2.12.5", "jsonschema==4.25.1", "cryptography==45.0.6", "uvicorn==0.35.0"]

[project.optional-dependencies]
platform = ["ray[default]==2.48.0", "mlflow-skinny==3.14.0", "boto3==1.40.0"]

[project.scripts]
galatea-mcp = "galatea_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/galatea-mcp/contracts" = ["contracts/*.json"]
