apiVersion: galatea/v1
kind: TrainingProject
metadata:
  name: wechat-persona
spec:
  task: causal-language-model-sft-lora
  executionBackend: ray
  packageName: wechat_persona
  compatibility:
    - task
    - datasetDigest
    - splitDigest
    - preprocessingVersion
    - metricDefinition
    - evaluationProtocol
    - role
  objective:
    metric: val_loss
    direction: min
  capabilities:
    pauseResume: false
  configRoot: configs
  entrypoints:
    checkConfig:
      - python
      - scripts/submit_train.py
      - --config
      - "{config}"
      - --check-config
    plan:
      - python
      - scripts/submit_train.py
      - --config
      - "{config}"
      - --plan
    train:
      - python
      - scripts/submit_train.py
      - --run
    evaluate:
      - python
      - scripts/submit_train.py
      - --run
  mlflow:
    experimentName: wechat-persona
    trackingUriEnv: MLFLOW_TRACKING_URI
  runEvidence:
    compatibility:
      task: {source: constant, value: causal-language-model-sft-lora}
      datasetDigest: {source: param, key: dataset.manifest_sha256}
      splitDigest: {source: param, key: dataset.split_sha256}
      preprocessingVersion: {source: param, key: dataset.preprocessing_version}
      metricDefinition: {source: constant, value: wechat-persona-quality-v1}
      evaluationProtocol: {source: param, key: evaluation.protocol_version}
      role: {source: tag, key: run.role}
    requiredTags:
      run.outcome: succeeded
      artifact.roundtrip_verified: "true"
    stageArtifacts:
      training-optimization:
        - reports/validation-quality.json
        - checkpoints/best-adapter.safetensors
        - checkpoints/trainer_state.json
        - model/adapter_config.json
        - model/adapter_model.safetensors
      final-validation:
        - reports/final-test-evaluation.json
        - model/adapter_config.json
        - model/adapter_model.safetensors
    modelSource:
      artifactPath: model
      uriTag: model.uri
  qualityGates:
    - name: final test loss
      source: metric
      key: test_loss
      operator: lte
      threshold: 10.0
      required: true
    - name: PII leakage
      source: metric
      key: test_pii_leak_count
      operator: eq
      threshold: 0
      required: true
    - name: canary leakage
      source: metric
      key: test_canary_leak_count
      operator: eq
      threshold: 0
      required: true
    - name: unsafe behavior
      source: metric
      key: test_unsafe_behavior_count
      operator: eq
      threshold: 0
      required: true
    - name: artifact round-trip
      source: tag
      key: artifact.roundtrip_verified
      operator: eq
      threshold: "true"
      required: true
