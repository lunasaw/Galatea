apiVersion: galatea/v1
kind: TrainingProject
metadata:
  name: ray-handwritten-digits
spec:
  task: image-classification
  objective:
    metric: val_accuracy
    direction: max
  compatibility:
    - task
    - datasetDigest
    - splitDigest
    - preprocessingVersion
    - metricDefinition
    - evaluationProtocol
    - role
  capabilities:
    pauseResume: false
  configRoot: configs
  entrypoints:
    checkConfig:
      - /data/conda/envs/attend-ray-py312/bin/python
      - scripts/train.py
      - --config
      - "{config}"
      - --check-config
    plan:
      - /data/conda/envs/attend-ray-py312/bin/python
      - scripts/train.py
      - --config
      - "{config}"
      - --plan
    train:
      - /data/conda/envs/attend-ray-py312/bin/python
      - scripts/train.py
      - --config
      - "{config}"
  mlflow:
    experimentName: ray-handwritten-digits
    trackingUriEnv: MLFLOW_TRACKING_URI
    registeredModelName: ray-handwritten-digits
  runEvidence:
    compatibility:
      task:
        source: constant
        value: image-classification
      datasetDigest:
        source: param
        key: data.content_sha256
      splitDigest:
        source: param
        key: data.split_sha256
      preprocessingVersion:
        source: param
        key: data.preprocessing_version
      metricDefinition:
        source: constant
        value: multiclass-accuracy-per-example-v1
      evaluationProtocol:
        source: constant
        value: kaggle-handwritten-digits-deterministic-holdout-v1
      role:
        source: tag
        key: run.role
    requiredTags:
      run.outcome: succeeded
      artifact.roundtrip_verified: "true"
    stageArtifacts:
      training-optimization:
        - reports/model-selection.json
      final-validation:
        - reports/final-test-evaluation.json
        - model/MLmodel
    modelSource:
      artifactPath: model
      uriTag: model.uri
  integrity:
    planOutputPath: integrity
    reports:
      preprocessing:
        artifactPath: reports/preprocessing-parity.json
        roles: [smoke, trial, champion]
        statusPath: status
        digestPath: content_digest
        statusSource: { source: tag, key: integrity.preprocessing.status }
        digestSource: { source: param, key: integrity.preprocessing_artifact_digest }
      migration:
        artifactPath: reports/migration-contamination.json
        roles: [smoke, trial, champion]
        statusPath: status
        digestPath: content_digest
        statusSource: { source: tag, key: integrity.migration.status }
        digestSource: { source: param, key: integrity.migration_artifact_digest }
    preprocessing:
      contexts:
        - { id: fit, roles: [smoke, trial, champion], outputPath: preprocessing.context_identity_tuples.fit }
        - { id: validation, roles: [smoke, trial, champion], outputPath: preprocessing.context_identity_tuples.validation }
        - { id: test, roles: [champion], outputPath: preprocessing.context_identity_tuples.test }
        - { id: inference, roles: [champion], outputPath: preprocessing.context_identity_tuples.inference }
      comparisons:
        - id: fit-validation
          roles: [smoke, trial, champion]
          checkPath: preprocessing.parity
          leftContext: fit
          rightContext: validation
          fields: [base_preprocessing_identity_sha256]
          required: true
        - id: fit-test
          roles: [champion]
          checkPath: preprocessing.parity
          leftContext: fit
          rightContext: test
          fields: [base_preprocessing_identity_sha256]
          required: true
        - id: fit-inference
          roles: [champion]
          checkPath: preprocessing.parity
          leftContext: fit
          rightContext: inference
          fields: [base_preprocessing_identity_sha256]
          required: true
    migration:
      enabled: true
      lineage:
        roles: [smoke, trial, champion]
        outputPath: migration.lineage
        allowed: [native-clean, reviewed-migrated]
        required: true
      contaminationChecks:
        - { id: source-scan, roles: [smoke, trial, champion], checkPath: migration.contamination.foreign_source_scan, required: true }
        - { id: fitted-state, roles: [smoke, trial, champion], checkPath: migration.contamination.fitted_state_leakage, required: true }
        - { id: contamination-status, roles: [smoke, trial, champion], checkPath: migration.contamination.status, required: true }
  qualityGates:
    - name: final test accuracy
      source: metric
      key: test_accuracy
      operator: gte
      threshold: 0.90
      required: true
    - name: final evaluation report
      source: evidence
      key: reports/final-test-evaluation.json
      operator: exists
      required: true
    - name: MLflow model descriptor
      source: evidence
      key: model/MLmodel
      operator: exists
      required: true
