schema_version: llm-lora-inference-v1
project: llm-lora-playground
service:
  name: llm-lora-playground-experimental
  host: 127.0.0.1
  port: 8000
  route_prefix: /
  replicas: 1
  max_ongoing_requests: 8
  health_check_period_s: 10
  health_check_timeout_s: 30
model:
  id: qwen35-wechat-trial
  lora_id: wechat-private-5k-standard-20260906-v2-step-944
  base_model_path: /data/ai/chenzhangyue/code/model/Qwen3.5-0.8B
  adapter_path: /data/ai/chenzhangyue/code/galatea/platform-data/llm-private/wechat-owner-bulk-approved-experiments/wechat_aa807aaad90dc4463964-20260905T151759Z/training/5486e8a7db3547919a66865983a81162/checkpoints/wechat-private-5k-standard-20260906-v2/step-944/adapter
  checkpoint_manifest_path: /data/ai/chenzhangyue/code/galatea/platform-data/llm-private/wechat-owner-bulk-approved-experiments/wechat_aa807aaad90dc4463964-20260905T151759Z/training/5486e8a7db3547919a66865983a81162/checkpoints/wechat-private-5k-standard-20260906-v2/step-944/checkpoint_manifest.json
  source_mlflow_run_id: 5486e8a7db3547919a66865983a81162
  engine: ray-serve-llm-vllm
  protocol: openai-chat-completions-v1
  dtype: bfloat16
  device: cuda:0
  max_input_tokens: 512
  # The historical adapter was trained through Qwen3_5ForCausalLM and its
  # keys are base_model.model.model.layers.*.  vLLM/Ray Serve currently loads
  # Qwen3_5ForConditionalGeneration, whose tree is different.  Keep this
  # explicit so readiness fails closed until a same-class adapter is exported.
  expected_architecture: qwen3_5_conditional_generation
  trust_remote_code: false
  enable_thinking: false
  lora_loading_path: s3://training-data/ray-runtime/llm-lora-playground-inference/5486e8a7db3547919a66865983a81162
  max_model_len: 512
  max_num_seqs: 1
  gpu_memory_utilization: 0.7
  max_loras: 1
generation:
  do_sample: false
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 64
  repetition_penalty: 1.15
  no_repeat_ngram_size: 4
  seed: 42
prompt:
  system_policy: "仅基于已提供的脱敏对话生成回复；不猜测或复述私人事实。"
memory:
  enabled: true
  protocol_version: memory-grounded-v1
  default_status: confirmed
  owner_scope_required: true
  allow_model_generated_writeback: false
  retrieval:
    lexical: bm25
    semantic: optional
    max_results: 5
governance:
  role: trial
  promotable: false
  quality_status: experimental_only
  test_access: untouched
  private_data_scope: authorized_redacted_only
resources:
  num_gpus: 1
  cpus: 4
  memory_gb: 8
output_root: platform-data/llm-private/wechat-owner-bulk-approved-experiments/wechat_aa807aaad90dc4463964-20260905T151759Z/serving
