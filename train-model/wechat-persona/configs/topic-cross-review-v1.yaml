schema_version: topic-cross-review-config-v1
method: topic-cross-family-audit-v1
seed: 42
max_candidates: 200
max_changed_candidates: 18
judges:
  independent:
    model: claude-sonnet-4-6
    family: claude
    returned_model_prefix: claude-sonnet-4-6
    transport: chat_completions
  changed_reference:
    model: gpt-5.6-sol
    family: gpt
    returned_model_prefix: gpt-5.6
    transport: responses
batch_size: 6
workers: 4
probe_judges: [independent]
# Three synthetic-only compatibility attempts are recorded in the preceding workspace.
# These are the remaining allowances within the original 44/350000/132000 budget.
max_requests: 41
max_retries: 0
max_output_tokens: 3000
max_input_tokens: 346832
max_total_output_tokens: 123000
max_batch_input_tokens: 16000
request_timeout_seconds: 120
minimum_confidence: 0.9
carry_forward_hard_risks:
  - privacy
  - third_party
  - control_or_abuse
  - unsafe
  - identity_or_capability
governance:
  training_run: false
  human_review_completed: false
  formal_training_eligible: false
  promotable: false
